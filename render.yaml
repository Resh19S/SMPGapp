# Render Blueprint — free trial deployment of the backend API.
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false"
# values when prompted (see docs/DEPLOY.md).
services:
  - type: web
    name: sunrise-pg-api
    runtime: python
    plan: free
    region: ohio                # same region as the Neon database (AWS us-east-2): the API makes many DB queries per page, so they must be close
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Real use: "manage.py init" creates missing tables and, on an empty
    # database, the owner login from OWNER_* below. It never adds demo data and
    # never touches existing data. (For a demo instead, swap in "python seed.py".)
    # --proxy-headers makes the login lockout see each visitor's real IP.
    startCommand: python manage.py init && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true     # random secret, created by Render
      - key: DATABASE_URL
        sync: false             # Neon connection string
      - key: ALLOWED_ORIGINS
        sync: false             # the Vercel address, e.g. https://sunrise-pg.vercel.app
      - key: OWNER_PASSWORD
        sync: false             # first owner login (8+ characters); only used while no owner exists
      - key: OWNER_USERNAME
        value: owner
      - key: PROPERTY_NAME
        sync: false             # optional: the building's name, created on an empty database
